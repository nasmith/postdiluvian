<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postdiluvian — cocktail recipes</title>
<meta name="description" content="A small, self-contained browser for a personal cocktail collection.">
<script>try{var t=localStorage.getItem("pd.theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fbf8f2;
    --paper-2: #f2ede1;
    --card: #ffffff;
    --ink: #17140f;
    --ink-soft: #6a6155;
    --line: #e4ddce;
    --line-strong: #17140f;
    --accent: #d8402c;      /* Campari red — identity + UI accent */
    --accent-soft: #b2381f;
    --gold: #d8402c;
    --blue: #1f3bd6;        /* cobalt — used sparingly: links, "yours", focus */
    --shadow: 0 1px 2px rgba(20,15,10,.05), 0 10px 28px rgba(20,15,10,.06);
    --serif: "Fraunces", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --radius: 6px;
    --maxw: 1180px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14110d;
      --paper-2: #1c1811;
      --card: #1e1a15;
      --ink: #efe7d8;
      --ink-soft: #a99d8b;
      --line: #322b22;
      --line-strong: #efe7d8;
      --accent: #ef6a4f;
      --accent-soft: #ef6a4f;
      --gold: #ef6a4f;
      --blue: #93a4ff;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --paper: #14110d; --paper-2: #1c1811; --card: #1e1a15; --ink: #efe7d8;
    --ink-soft: #a99d8b; --line: #322b22; --line-strong: #efe7d8; --accent: #ef6a4f;
    --accent-soft: #ef6a4f; --gold: #ef6a4f; --blue: #93a4ff;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.4);
  }

  * { box-sizing: border-box; }
  html {
    -webkit-text-size-adjust: 100%;
    overflow-y: scroll;                 /* always reserve the scrollbar */
    scrollbar-width: thin;
    scrollbar-color: var(--ink-soft) transparent;
  }
  ::-webkit-scrollbar { width: 13px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--ink-soft); border: 3px solid var(--paper); border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink); }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); line-height: 1.5;
    font-size: 16px;
  }
  a { color: var(--blue); text-underline-offset: 2px; }
  h1, h2, h3 {
    font-family: var(--serif); font-weight: 600; line-height: 1.06;
    letter-spacing: -.015em; margin: 0; font-optical-sizing: auto;
  }
  button { font: inherit; cursor: pointer; color: inherit; }
  input { font: inherit; }

  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 22px; }

  header.top {
    border-bottom: 1px solid var(--line);
    background: var(--paper);
    position: sticky; top: 0; z-index: 30;
  }
  .top .wrap { padding-top: 16px; padding-bottom: 14px; }
  .brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .dovemark {
    align-self: center; width: auto; flex: none;
    height: clamp(42px, 3vw + 30px, 58px);
    margin-right: -2px; pointer-events: none; user-select: none;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .dovemark { filter: invert(1); }
  }
  :root[data-theme="dark"] .dovemark { filter: invert(1); }
  @media (max-width: 600px) { .dovemark { height: 38px; } }
  .brand h1 { font-size: clamp(1.7rem, 1.15rem + 2.1vw, 2.5rem); }
  .brand .sub { font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--accent-soft); font-size: 1rem; }

  .toolbar { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
  .search {
    flex: 1 1 260px; display: flex; align-items: center; gap: 8px;
    background: var(--card); border: 1.5px solid var(--line-strong); border-radius: var(--radius);
    padding: 9px 14px;
  }
  .search:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(31,59,214,.16); }
  .search input { border: 0; background: transparent; outline: none; width: 100%; color: inherit; }
  .search svg { flex: none; opacity: .55; }

  .seg { display: inline-flex; border: 1.5px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; background: var(--card); }
  .seg button { padding: 8px 13px; border: 0; background: transparent; color: var(--ink-soft); font-size: .8rem; font-weight: 600; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }

  .iconbtn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 38px; height: 38px; padding: 0; flex: none;
    border: 1.5px solid var(--line-strong); border-radius: var(--radius);
    background: var(--card); color: var(--ink);
  }
  .iconbtn:hover { background: var(--paper-2); }
  @media (pointer: coarse) { .iconbtn { width: 44px; height: 44px; } }

  .chip {
    padding: 6px 12px; border-radius: var(--radius); border: 1.5px solid var(--line-strong);
    background: var(--card); color: var(--ink); font-size: .82rem; font-weight: 500; white-space: nowrap;
  }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .chip.accent[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }  /* Favorites + My bar: "yours" */

  .filters { padding: 16px 0 6px; border-bottom: 1px solid var(--line); }
  .filt-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 9px; }
  .filt-row .label { font-size: .68rem; font-weight: 700; color: var(--ink); text-transform: uppercase; letter-spacing: .13em; margin-right: 6px; min-width: 52px; }
  .more-btn { background: transparent; border: 0; color: var(--blue); font-size: .8rem; text-decoration: underline; padding: 4px; }
  .clearall { background: transparent; border: 0; color: var(--ink-soft); font-size: .78rem; text-decoration: underline; }

  main { padding: 22px 0 96px; }
  .listhead { display: flex; align-items: baseline; gap: 12px; margin: 2px 0 16px; }
  .listhead[hidden] { display: none; }
  .listhead .count { font-family: var(--serif); font-weight: 600; font-size: 1.15rem; letter-spacing: -.01em; color: var(--ink); text-transform: none; }
  .listhead .sub { font-family: var(--sans); font-weight: 700; font-size: .64rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(248px, 1fr)); gap: 14px; align-items: start; }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }

  .grouphead { grid-column: 1 / -1; font-family: var(--sans); font-weight: 700; text-transform: uppercase; letter-spacing: .13em; font-size: .68rem; color: var(--ink-soft); margin: 10px 0 -2px; }
  .grouphead:first-child { margin-top: 0; }
  .grouphead.favs { color: var(--blue); }

  .scrollfade {
    position: fixed; left: 0; right: 0; bottom: 0; height: 54px; z-index: 20;
    pointer-events: none; opacity: 0; transition: opacity .25s ease;
    background: linear-gradient(to bottom, transparent, var(--paper));
  }

  .card {
    background: var(--card); border: 1.5px solid var(--ink); border-radius: var(--radius);
    padding: 14px 15px 13px; box-shadow: none; position: relative; min-height: 128px;
    display: flex; flex-direction: column; gap: 4px; cursor: pointer;
    transition: transform .1s ease, box-shadow .1s ease;
  }
  @media (hover: hover) {
    .card:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--ink); }
    .card:hover h3 { color: var(--accent); }
  }
  .card:active { background: var(--paper-2); }
  .card:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .card h3 { font-size: 1.3rem; line-height: 1.1; padding-right: 30px; }
  .card .base { font-family: var(--sans); font-size: .64rem; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; color: var(--accent); }
  .card .pour { color: var(--ink-soft); font-size: .87rem; line-height: 1.4; }
  .card .tags { display: flex; gap: 10px; flex-wrap: wrap; margin-top: auto; padding-top: 9px; }
  .tag { font-size: .64rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-soft); border: 0; border-radius: 0; padding: 0; }
  .fav {
    position: absolute; top: 4px; right: 2px; border: 0; background: transparent;
    font-size: 1.1rem; line-height: 1; color: var(--line); padding: 9px;
  }
  .fav[aria-pressed="true"] { color: var(--blue); }
  .card .bar-badge {
    font-size: .64rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    padding: 2px 0; margin-top: 3px; align-self: flex-start; border: 0;
  }
  .bar-badge.ok { color: var(--blue); }
  .bar-badge.close { color: var(--accent); }

  .empty { color: var(--ink-soft); padding: 50px 4px; font-style: italic; }
  .wishlist-head { grid-column: 1 / -1; font-family: var(--sans); font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .13em; font-size: .7rem; border-top: 1px solid var(--line); padding-top: 16px; margin-top: 10px; }

  /* detail overlay */
  .overlay { position: fixed; inset: 0; background: rgba(23,20,15,.5); z-index: 50; display: none; }
  .overlay.open { display: block; }
  .sheet {
    position: absolute; top: 0; right: 0; height: 100%; width: min(560px, 100%);
    background: var(--paper); border-left: 1.5px solid var(--ink);
    overflow-y: auto; padding: 28px 32px 60px; box-shadow: -20px 0 60px rgba(0,0,0,.18);
  }
  .sheet .close {
    position: absolute; top: 8px; right: 8px; width: 40px; height: 40px; font-size: 1.6rem;
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: 0; color: var(--ink-soft); border-radius: 999px; z-index: 2;
  }
  .sheet .close:hover { background: var(--paper-2); }
  .sheet .eyebrow { font-family: var(--sans); text-transform: uppercase; letter-spacing: .14em; font-size: .68rem; font-weight: 700; color: var(--accent); }
  .sheet h2 { font-size: clamp(2rem, 1.55rem + 2vw, 2.6rem); margin: 5px 0 3px; }
  .sheet .aka { color: var(--ink-soft); font-style: italic; font-size: .9rem; }
  .sheet .meta { color: var(--ink-soft); font-size: .86rem; margin: 10px 0 18px; }
  .recipe { border-top: 2px solid var(--ink); border-bottom: 1px solid var(--line); padding: 14px 0; }
  .recipe ul { list-style: none; margin: 0; padding: 0; }
  .recipe li { display: flex; gap: 14px; padding: 5px 0; align-items: baseline; }
  .recipe li .amt { font-variant-numeric: tabular-nums; font-family: var(--serif); font-weight: 600; min-width: 76px; text-align: right; color: var(--ink); flex: none; }
  .recipe li .ing { flex: 1; }
  .recipe li .note { color: var(--ink-soft); font-style: italic; font-size: .84rem; }
  .recipe li.missing .ing { color: var(--accent); }
  .recipe li .brandhint { color: var(--ink-soft); font-size: .78rem; }
  .scaler { display: flex; align-items: center; gap: 8px; margin: 14px 0 4px; flex-wrap: wrap; }
  ol.steps { margin: 14px 0 0; padding-left: 18px; }
  ol.steps li { padding: 3px 0; }
  .section-h { font-family: var(--sans); font-weight: 700; text-transform: uppercase; letter-spacing: .13em; font-size: .68rem; color: var(--ink); margin: 22px 0 7px; }
  .missing-line { color: var(--accent); font-size: .9rem; margin-top: 10px; }
  .src a { word-break: break-word; }

  /* bar panel */
  .barpanel .sheet { left: 0; right: auto; border-left: 0; border-right: 1.5px solid var(--ink); box-shadow: 20px 0 60px rgba(0,0,0,.18); }
  .bar-search { width: 100%; padding: 9px 12px; border: 1.5px solid var(--line-strong); border-radius: var(--radius); background: var(--card); color: inherit; margin: 6px 0 14px; }
  .bar-group h4 { font-family: var(--sans); font-weight: 700; font-size: .68rem; text-transform: uppercase; letter-spacing: .12em; color: var(--ink); margin: 18px 0 6px; }
  .bar-group label { display: flex; gap: 9px; align-items: flex-start; padding: 4px 0; font-size: .93rem; }
  .bar-group input { margin-top: 3px; }
  .bar-actions { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  .btn { border: 1.5px solid var(--line-strong); background: var(--card); border-radius: var(--radius); padding: 8px 14px; font-size: .84rem; font-weight: 600; }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }

  .footer { color: var(--ink-soft); font-size: .82rem; text-align: center; padding: 30px 20px 50px; }
  .footer a { color: var(--blue); }

  .collnote { margin-top: 10px; font-size: .8rem; color: var(--ink-soft); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .collnote #collLabel { font-style: italic; }
  .linkbtn { background: transparent; border: 0; color: var(--blue); text-decoration: underline; font-size: .8rem; padding: 0; }
  .drophint {
    position: fixed; inset: 16px; z-index: 60; border: 2px dashed var(--blue);
    border-radius: 14px; background: rgba(31,59,214,.06); display: none;
    align-items: center; justify-content: center; font-family: var(--serif);
    font-style: italic; font-size: 1.4rem; color: var(--blue); pointer-events: none;
  }
  body.dragging .drophint { display: flex; }

  @media (max-width: 600px) {
    header.top { position: static; }                    /* don't pin a tall header on phones */
    .top .wrap { padding-top: 14px; padding-bottom: 12px; }
    .toolbar { margin-top: 12px; }
    .filt-row { align-items: flex-start; }
    .filt-row .label { flex: 0 0 100%; min-width: 0; margin: 0 0 6px; }  /* label on its own line, chips flush left */
    .listhead { margin-bottom: 12px; }
    .card { min-height: 0; }
    .sheet {
      width: 100%; border-left: 0; border-radius: 16px 16px 0 0;
      top: auto; bottom: 0; height: 92%; padding: 24px 20px 40px;
    }
    .sheet::before {
      content: ""; position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
      width: 40px; height: 4px; border-radius: 999px; background: var(--line-strong); opacity: .3;
    }
    .barpanel .sheet { border-right: 0; }
  }
  @media (pointer: coarse) {
    .fav { padding: 12px; }
    .seg button { padding: 10px 15px; }
    .linkbtn { padding: 5px 0; }
    .more-btn, .clearall { padding: 6px 4px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <img class="dovemark" src="assets/dove.png" alt="" aria-hidden="true">
      <h1>Postdiluvian</h1>
      <span class="sub">from Noah Smith</span>
    </div>
    <div class="toolbar">
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" type="search" placeholder="Search names, ingredients, notes…" autocomplete="off" spellcheck="false">
      </label>
      <div class="seg" role="group" aria-label="Units">
        <button id="u-oz" aria-pressed="false">oz</button>
        <button id="u-ml" aria-pressed="true">ml</button>
      </div>
      <button class="iconbtn" id="themeBtn" type="button" aria-pressed="false" aria-label="Switch theme"></button>
      <button class="chip accent" id="favToggle" aria-pressed="false" title="Show only favorites">★ Favorites</button>
      <button class="chip accent" id="barToggle" aria-pressed="false" title="Show only what you can make">🍸 My bar</button>
      <button class="btn" id="openBar">Edit bar…</button>
    </div>
    <div class="collnote">
      <span id="collLabel"></span>
      <input type="file" id="collFile" accept="application/json,.json" hidden>
      <button class="linkbtn" id="collLoad">Load a collection file…</button>
      <button class="linkbtn" id="collReset" hidden>Reset to public</button>
    </div>
  </div>
</header>

<div class="wrap filters" id="filters"></div>

<main class="wrap">
  <div class="listhead" id="listhead">
    <span class="count" id="count"></span>
    <span class="sub" id="listsort">A–Z</span>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>Nothing matches those filters.</div>
</main>

<div class="scrollfade" id="scrollfade" aria-hidden="true"></div>
<div class="drophint" id="drophint">Drop a collection file to load it</div>

<div class="footer">
  Postdiluvian · <span id="fcount"></span> · <span id="collFoot"></span>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="d-title">
  <div class="sheet" id="sheet"></div>
</div>

<div class="overlay barpanel" id="barOverlay" role="dialog" aria-modal="true" aria-label="Your bar">
  <div class="sheet" id="barSheet"></div>
</div>

<script>
(function () {
  "use strict";
  var LS = { bar: "pd.bar", fav: "pd.fav", units: "pd.units", basics: "pd.basics", collection: "pd.collection", theme: "pd.theme" };
  var PUBLIC_URL = "data/collection.json";
  var KIND = "postdiluvian-collection";
  function load(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  var state = {
    q: "",
    base: new Set(),      // family names or specific ingredient ids
    tags: new Set(),
    method: new Set(),
    glass: new Set(),
    showMore: false,
    favOnly: false,
    barOnly: false,
    units: load(LS.units, "ml"),
    assumeBasics: load(LS.basics, true),
    scale: 1,
    bar: new Set(load(LS.bar, [])),
    fav: new Set(load(LS.fav, []))
  };

  var COCKTAILS = [], INGREDIENTS = [], ingById = {}, famOf = {};
  var COLL = { meta: {}, source: "public" };   // source: "public" | "custom"
  var FAMILY_LABEL = { gin: "Gin", whiskey: "Whiskey", rum: "Rum", agave: "Agave", brandy: "Brandy", vodka: "Vodka", aquavit: "Aquavit", other: "Other" };
  var TAG_ORDER = ["spirit-forward", "sour", "bitter", "citrus", "aperitivo", "shaken", "stirred", "sparkling", "tiki", "egg", "low-abv"];

  function validCollection(obj) {
    return obj && obj.meta && obj.meta.kind === KIND &&
      Array.isArray(obj.cocktails) && Array.isArray(obj.ingredients);
  }

  function applyCollection(obj, source) {
    COCKTAILS = obj.cocktails;
    INGREDIENTS = obj.ingredients;
    ingById = {}; famOf = {};
    INGREDIENTS.forEach(function (i) { ingById[i.id] = i; famOf[i.id] = i.family; });
    COLL = { meta: obj.meta || {}, source: source };
    // drop filter selections that no longer exist in this collection
    var famPresent = {}, tagPresent = {};
    COCKTAILS.forEach(function (c) {
      c.base.forEach(function (b) { famPresent[famOf[b] || "other"] = 1; });
      c.tags.forEach(function (t) { tagPresent[t] = 1; });
    });
    state.base.forEach(function (v) { if (!famPresent[v] && !ingById[v]) state.base.delete(v); });
    state.tags.forEach(function (v) { if (!tagPresent[v]) state.tags.delete(v); });
    initUnits();
    buildFilters();
    render();
    renderCollNote();
  }

  function loadPublic() {
    return fetch(PUBLIC_URL, { cache: "no-cache" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function (obj) {
      if (!validCollection(obj)) throw new Error("not a collection file");
      try { localStorage.removeItem(LS.collection); } catch (e) {}
      applyCollection(obj, "public");
      afterFirstLoad();
    });
  }

  function bootstrap() {
    var cached = null;
    try { cached = localStorage.getItem(LS.collection); } catch (e) {}
    if (cached) {
      try {
        var obj = JSON.parse(cached);
        if (validCollection(obj)) { applyCollection(obj, "custom"); afterFirstLoad(); return; }
      } catch (e) {}
      try { localStorage.removeItem(LS.collection); } catch (e2) {}
    }
    loadPublic().catch(function (err) {
      document.getElementById("grid").innerHTML =
        '<div class="empty">Could not load the collection. If you opened this file directly, serve the folder instead: <code>python3 -m http.server</code></div>';
      console.error(err);
    });
  }

  var firstLoadDone = false;
  function afterFirstLoad() {
    if (firstLoadDone) return;
    firstLoadDone = true;
    if (location.hash.length > 1) openDetail(decodeURIComponent(location.hash.slice(1)), true, true);
  }

  function ingestFile(file) {
    if (!file) return;
    file.text().then(function (text) {
      var obj;
      try { obj = JSON.parse(text); } catch (e) { alert("That file isn’t valid JSON."); return; }
      if (!validCollection(obj)) {
        alert("That doesn’t look like a Postdiluvian collection file (expected meta.kind “" + KIND + "” with cocktails and ingredients arrays).");
        return;
      }
      try { localStorage.setItem(LS.collection, text); }
      catch (e) { alert("Loaded, but it’s too large to remember — you’ll need to re-load it next visit."); }
      applyCollection(obj, "custom");
      afterFirstLoad();
    });
  }

  function renderCollNote() {
    var m = COLL.meta || {};
    var name = m.name || (COLL.source === "custom" ? "Loaded collection" : "Public collection");
    var ver = m.version ? " · v" + m.version : "";
    document.getElementById("collLabel").textContent =
      (COLL.source === "custom" ? "Viewing: " : "") + name + ver +
      " · " + COCKTAILS.length + " recipes";
    document.getElementById("collReset").hidden = COLL.source !== "custom";
    document.getElementById("collLoad").textContent =
      COLL.source === "custom" ? "Load a different file…" : "Load a collection file…";
    document.getElementById("collFoot").textContent = name + ver;
  }

  // ---------- amount formatting ----------
  var FRAC = [[0, ""], [0.125, "⅛"], [0.25, "¼"], [0.333, "⅓"], [0.375, "⅜"],
              [0.5, "½"], [0.625, "⅝"], [0.667, "⅔"], [0.75, "¾"], [0.875, "⅞"], [1, ""]];
  function ozText(ml) {
    var oz = ml / 30, whole = Math.floor(oz + 1e-6), frac = oz - whole, best = FRAC[0], bd = 9;
    FRAC.forEach(function (f) { var d = Math.abs(f[0] - frac); if (d < bd) { bd = d; best = f; } });
    if (best[0] === 1) { whole += 1; best = FRAC[0]; }
    var s = (whole ? whole : "") + (best[1] || (whole ? "" : (Math.round(oz * 100) / 100)));
    return s + " oz";
  }
  function mlText(ml) { return (Math.round(ml * 2) / 2).toString().replace(/\.0$/, "") + " ml"; }

  function amountText(ing) {
    var s = state.scale, pre = ing.approx === "max" ? "≤" : "";
    if (ing.unit === "tsp" || ing.unit === "barspoon") {
      var n = (ing.ml * s) / 5;
      n = Math.round(n * 4) / 4;
      return pre + n + (ing.unit === "tsp" ? " tsp" : " bar spoon");
    }
    if (ing.ml != null) return pre + (state.units === "oz" ? ozText(ing.ml * s) : mlText(ing.ml * s));
    if (ing.amount != null) {
      var a = ing.amount * s;
      if (ing.unit === "dash" || ing.unit === "drops") { a = Math.round(a * 10) / 10; return a + " " + ing.unit + (a === 1 && ing.unit === "dash" ? "" : ing.unit === "dash" ? "es" : ""); }
      if (ing.unit === "piece") return String(Math.round(a));
      return a + (ing.unit ? " " + ing.unit : "");
    }
    if (ing.unit === "rinse") return "rinse";
    if (ing.unit === "top") return "to top";
    if (ing.unit === "leaves") return "leaves";
    if (ing.unit === "sprig") return "sprig";
    return "";
  }

  // ---------- bar logic ----------
  function missingRefs(c) {
    var seen = {}, out = [];
    c.ingredients.forEach(function (i) {
      var ing = ingById[i.ref];
      if (!ing || seen[i.ref]) return;
      if (state.assumeBasics && ing.pantry) return;
      if (i.unit === "rinse") return;
      if (!state.bar.has(i.ref)) { seen[i.ref] = 1; out.push(i.ref); }
    });
    return out;
  }

  // ---------- filtering ----------
  function baseMatches(c) {
    if (!state.base.size) return true;
    return c.base.some(function (b) {
      return state.base.has(b) || state.base.has(famOf[b] || "other");
    });
  }
  function textMatches(c) {
    if (!state.q) return true;
    var q = state.q.toLowerCase();
    if (c.name.toLowerCase().indexOf(q) >= 0) return true;
    if ((c.aka || []).join(" ").toLowerCase().indexOf(q) >= 0) return true;
    if ((c.notes || "").toLowerCase().indexOf(q) >= 0) return true;
    var src = c.source || {};
    if (((src.book || "") + " " + (src.author || "") + " " + (src.note || "")).toLowerCase().indexOf(q) >= 0) return true;
    return c.ingredients.some(function (i) {
      var ing = ingById[i.ref];
      return ing && (ing.name.toLowerCase().indexOf(q) >= 0 || (ing.aliases || []).join(" ").toLowerCase().indexOf(q) >= 0);
    });
  }
  function passes(c) {
    if (!textMatches(c)) return false;
    if (!baseMatches(c)) return false;
    var tagsOk = true;
    state.tags.forEach(function (t) { if (c.tags.indexOf(t) < 0) tagsOk = false; });
    if (!tagsOk) return false;
    if (state.method.size && !state.method.has(c.method)) return false;
    if (state.glass.size && !state.glass.has(c.glass)) return false;
    if (state.favOnly && !state.fav.has(c.id)) return false;
    if (state.barOnly && missingRefs(c).length) return false;
    return true;
  }

  function sortList(list) {
    return list.slice().sort(function (a, b) {
      if (state.barOnly || state.bar.size) {
        var ma = missingRefs(a).length, mb = missingRefs(b).length;
        if (ma !== mb) return ma - mb;
      }
      return a.name.localeCompare(b.name);
    });
  }

  // ---------- rendering ----------
  function chip(label, on, cls) {
    return '<button class="chip ' + (cls || "") + '" aria-pressed="' + (on ? "true" : "false") + '">' + label + "</button>";
  }

  function buildFilters() {
    var el = document.getElementById("filters");
    var fams = {};
    COCKTAILS.forEach(function (c) { c.base.forEach(function (b) { var f = famOf[b] || "other"; fams[f] = (fams[f] || 0) + 1; }); });
    var famRow = Object.keys(FAMILY_LABEL).filter(function (f) { return fams[f]; })
      .map(function (f) { return '<button class="chip" data-kind="base" data-val="' + f + '" aria-pressed="false">' + FAMILY_LABEL[f] + ' <span style="opacity:.5">' + fams[f] + '</span></button>'; }).join("");

    var tagCounts = {};
    COCKTAILS.forEach(function (c) { c.tags.forEach(function (t) { tagCounts[t] = (tagCounts[t] || 0) + 1; }); });
    var tagRow = TAG_ORDER.filter(function (t) { return tagCounts[t]; })
      .map(function (t) { return '<button class="chip" data-kind="tags" data-val="' + t + '" aria-pressed="false">' + t + '</button>'; }).join("");

    var methods = uniq(COCKTAILS.map(function (c) { return c.method; }));
    var glasses = uniq(COCKTAILS.map(function (c) { return c.glass; }));
    var methodRow = methods.map(function (m) { return '<button class="chip" data-kind="method" data-val="' + m + '" aria-pressed="false">' + m + '</button>'; }).join("");
    var glassRow = glasses.map(function (g) { return '<button class="chip" data-kind="glass" data-val="' + g + '" aria-pressed="false">' + g.replace(/-/g, " ") + '</button>'; }).join("");

    el.innerHTML =
      '<div class="filt-row"><span class="label">Spirit</span>' + famRow + '</div>' +
      '<div class="filt-row"><span class="label">Style</span>' + tagRow +
        '<button class="more-btn" id="moreBtn">' + (state.showMore ? "less –" : "more …") + '</button>' +
        '<button class="clearall" id="clearAll">clear all</button></div>' +
      '<div id="moreWrap" ' + (state.showMore ? "" : "hidden") + '>' +
        '<div class="filt-row"><span class="label">Method</span>' + methodRow + '</div>' +
        '<div class="filt-row"><span class="label">Glass</span>' + glassRow + '</div>' +
      '</div>';

    el.querySelectorAll(".chip[data-kind]").forEach(function (b) {
      b.addEventListener("click", function () {
        var set = state[b.dataset.kind];
        if (set.has(b.dataset.val)) set.delete(b.dataset.val); else set.add(b.dataset.val);
        syncChips(); render();
      });
    });
    document.getElementById("moreBtn").addEventListener("click", function () {
      state.showMore = !state.showMore;
      document.getElementById("moreWrap").hidden = !state.showMore;
      this.textContent = state.showMore ? "less –" : "more …";
    });
    document.getElementById("clearAll").addEventListener("click", function () {
      state.base.clear(); state.tags.clear(); state.method.clear(); state.glass.clear();
      state.favOnly = state.barOnly = false; state.q = ""; document.getElementById("q").value = "";
      syncChips(); syncToggles(); render();
    });
    syncChips();
  }

  function syncChips() {
    document.querySelectorAll(".chip[data-kind]").forEach(function (b) {
      b.setAttribute("aria-pressed", state[b.dataset.kind].has(b.dataset.val) ? "true" : "false");
    });
  }
  function syncToggles() {
    document.getElementById("favToggle").setAttribute("aria-pressed", state.favOnly ? "true" : "false");
    document.getElementById("barToggle").setAttribute("aria-pressed", state.barOnly ? "true" : "false");
  }

  function render() {
    var actives = COCKTAILS.filter(function (c) { return c.status !== "wishlist" && passes(c); });
    var wish = COCKTAILS.filter(function (c) { return c.status === "wishlist" && passes(c); });
    var favs = sortList(actives.filter(function (c) { return state.fav.has(c.id); }));
    var rest = sortList(actives.filter(function (c) { return !state.fav.has(c.id); }));
    var grid = document.getElementById("grid");
    var heads = favs.length && rest.length;
    var html = "";
    if (favs.length) {
      if (heads) html += '<div class="grouphead favs">★ Favorites</div>';
      html += favs.map(cardHTML).join("");
    }
    if (rest.length) {
      if (heads) html += '<div class="grouphead">A–Z</div>';
      html += rest.map(cardHTML).join("");
    }
    if (wish.length) html += '<div class="wishlist-head">On the list — needs a spec</div>' + wish.map(cardHTML).join("");
    grid.innerHTML = html;
    var anyResults = actives.length + wish.length > 0;
    document.getElementById("empty").hidden = anyResults;
    document.getElementById("listhead").hidden = !anyResults;

    grid.querySelectorAll(".card").forEach(function (el) {
      el.addEventListener("click", function (e) {
        if (e.target.closest(".fav")) return;
        openDetail(el.dataset.id, true);
      });
      el.addEventListener("keydown", function (e) { if (e.key === "Enter") openDetail(el.dataset.id, true); });
      var fav = el.querySelector(".fav");
      if (fav) fav.addEventListener("click", function () { toggleFav(el.dataset.id); });
    });

    var total = activeCount();
    var countEl = document.getElementById("count");
    if (state.bar.size) countEl.textContent = countMakeable() + " of " + total + " you can make";
    else if (actives.length < total) countEl.textContent = actives.length + " of " + total + " recipes";
    else countEl.textContent = total + " recipe" + (total === 1 ? "" : "s");
    document.getElementById("listsort").textContent = favs.length ? "Favorites first" : "A–Z";
    document.getElementById("fcount").textContent = state.fav.size + " favorite" + (state.fav.size === 1 ? "" : "s");
    updateFade();
  }
  function activeCount() { return COCKTAILS.filter(function (c) { return c.status !== "wishlist"; }).length; }
  function countMakeable() { return COCKTAILS.filter(function (c) { return c.status !== "wishlist" && !missingRefs(c).length; }).length; }

  function cardHTML(c) {
    var pourNames = [];
    c.ingredients.forEach(function (i) {
      var ing = ingById[i.ref];
      if (!ing || ing.category === "bitters") return;
      if (pourNames.indexOf(ing.name) < 0) pourNames.push(ing.name);
    });
    var pour = pourNames.slice(0, 4).join(" · ");
    var baseLabel = c.base.map(function (b) { return ingById[b] ? ingById[b].name : b; }).join(" / ") || "—";
    var badge = "";
    if (state.bar.size && c.status !== "wishlist") {
      var m = missingRefs(c);
      if (!m.length) badge = '<span class="bar-badge ok">☑︎ you can make this</span>';
      else if (m.length === 1) badge = '<span class="bar-badge close">☐︎ missing ' + (ingById[m[0]] ? ingById[m[0]].name : m[0]) + '</span>';
    }
    return '<article class="card" tabindex="0" data-id="' + c.id + '">' +
      '<button class="fav" aria-pressed="' + (state.fav.has(c.id) ? "true" : "false") + '" aria-label="Favorite">' +
        (state.fav.has(c.id) ? "★" : "☆") + '</button>' +
      '<div class="base">' + esc(baseLabel) + '</div>' +
      '<h3>' + esc(c.name) + '</h3>' +
      '<div class="pour">' + esc(pour) + '</div>' +
      badge +
      '<div class="tags">' + c.tags.slice(0, 4).map(function (t) { return '<span class="tag">' + t + '</span>'; }).join("") + '</div>' +
    '</article>';
  }

  // ---------- detail ----------
  var navPushed = false;   // did we add a history entry we can pop to close?
  function openDetail(id, resetScale, fromHistory) {
    var c = COCKTAILS.find(function (x) { return x.id === id; });
    if (!c) return;
    if (resetScale) state.scale = 1;
    var wasOpen = document.getElementById("overlay").classList.contains("open");
    if (fromHistory) { /* URL already reflects this state */ }
    else if (wasOpen) history.replaceState(null, "", "#" + id);
    else { history.pushState({ sheet: id }, "", "#" + id); navPushed = true; }
    var sheet = document.getElementById("sheet");
    sheet.innerHTML = detailHTML(c);
    sheet.style.transform = "";
    sheet.style.transition = "";
    document.getElementById("overlay").classList.add("open");
    document.body.style.overflow = "hidden";
    sheet.querySelector(".close").addEventListener("click", function () { closeDetail(); });
    sheet.querySelector(".d-fav").addEventListener("click", function () { toggleFav(id); openDetail(id); });
    sheet.querySelectorAll("[data-scale]").forEach(function (b) {
      b.addEventListener("click", function () {
        state.scale = parseFloat(b.dataset.scale);
        openDetail(id);
      });
    });
    var cs = sheet.querySelector("#customScale");
    if (cs) cs.addEventListener("change", function () { state.scale = Math.max(0.1, parseFloat(cs.value) || 1); openDetail(id); });
    sheet.scrollTop = 0;
  }
  function closeDetail(fromHistory) {
    var overlay = document.getElementById("overlay");
    if (!overlay.classList.contains("open")) return;
    if (!fromHistory && navPushed) { history.back(); return; }   // let popstate finish the close
    navPushed = false;
    overlay.classList.remove("open");
    document.body.style.overflow = "";
    var sheet = document.getElementById("sheet");
    sheet.style.transition = ""; sheet.style.transform = "";
    if (!fromHistory && location.hash.length > 1) history.replaceState(null, "", location.pathname + location.search);
  }
  function detailHTML(c) {
    var src = c.source || {};
    var srcbits = [];
    if (src.book) srcbits.push("<em>" + esc(src.book) + "</em>" + (src.author ? ", " + esc(src.author) : "") + (src.page ? ", p. " + src.page : ""));
    else if (src.author) srcbits.push(esc(src.author));
    if (src.note) srcbits.push(esc(src.note));
    if (src.url) srcbits.push('<a href="' + esc(src.url) + '" target="_blank" rel="noopener">source ↗</a>');
    var miss = state.bar.size ? missingRefs(c) : [];

    var lis = c.ingredients.map(function (i) {
      var ing = ingById[i.ref] || { name: i.ref, brands: [] };
      var isMiss = miss.indexOf(i.ref) >= 0;
      var brand = i.brand || (ing.brands && ing.brands.length ? ing.brands[0] : "");
      if (brand && brand.toLowerCase() === ing.name.toLowerCase()) brand = "";
      return '<li class="' + (isMiss ? "missing" : "") + '">' +
        '<span class="amt">' + esc(amountText(i)) + '</span>' +
        '<span class="ing">' + esc(ing.name) +
          (i.note ? ' <span class="note">(' + esc(i.note) + ")</span>" : "") +
          (brand ? '<br><span class="brandhint">' + (i.brand ? "" : "e.g. ") + esc(brand) + "</span>" : "") +
        '</span></li>';
    }).join("");

    var sc_ = state.scale;
    function sbtn(v, lbl) { return '<button class="btn' + (sc_ === v ? " primary" : "") + '" data-scale="' + v + '">' + lbl + "</button>"; }

    return '<button class="close" aria-label="Close">×</button>' +
      '<div class="eyebrow">' + esc(c.base.map(function (b) { return ingById[b] ? ingById[b].name : b; }).join(" / ") || "cocktail") + '</div>' +
      '<h2 id="d-title">' + esc(c.name) +
        ' <button class="d-fav fav" style="position:static;font-size:1.2rem" aria-pressed="' + (state.fav.has(c.id) ? "true" : "false") + '">' + (state.fav.has(c.id) ? "★" : "☆") + "</button></h2>" +
      (c.aka && c.aka.length ? '<div class="aka">also: ' + esc(c.aka.join(", ")) + "</div>" : "") +
      '<div class="meta">' + esc(c.method) + " · " + esc((c.glass || "").replace(/-/g, " ")) +
        " · " + esc(c.service || "") + (c.garnish && c.garnish !== "None" ? " · garnish: " + esc(c.garnish.toLowerCase()) : "") + "</div>" +

      '<div class="scaler"><span class="section-h" style="margin:0">Batch</span>' +
        sbtn(1, "1×") + sbtn(2, "2×") + sbtn(4, "4×") +
        '<input id="customScale" type="number" min="0.5" step="0.5" value="' + sc_ + '" style="width:64px;padding:6px;border:1.5px solid var(--line-strong);border-radius:var(--radius);background:var(--card);color:inherit">' +
      "</div>" +

      '<div class="recipe"><ul>' + lis + "</ul>" +
        (miss.length ? '<div class="missing-line">Your bar is missing: ' + miss.map(function (r) { return esc(ingById[r] ? ingById[r].name : r); }).join(", ") + "</div>" : "") +
      "</div>" +

      (c.steps && c.steps.length ? '<div class="section-h">Method</div><ol class="steps">' + c.steps.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ol>" : "") +
      (c.notes ? '<div class="section-h">Notes</div><p>' + esc(c.notes) + "</p>" : "") +
      (srcbits.length ? '<div class="section-h">Source</div><p class="src">' + srcbits.join(" · ") + "</p>" : "");
  }

  // ---------- favorites / units ----------
  function toggleFav(id) {
    if (state.fav.has(id)) state.fav.delete(id); else state.fav.add(id);
    save(LS.fav, Array.from(state.fav));
    render();
  }
  function initUnits() {
    document.getElementById("u-oz").setAttribute("aria-pressed", state.units === "oz" ? "true" : "false");
    document.getElementById("u-ml").setAttribute("aria-pressed", state.units === "ml" ? "true" : "false");
  }
  function setUnits(u) {
    state.units = u; save(LS.units, u); initUnits();
    if (document.getElementById("overlay").classList.contains("open") && location.hash.length > 1) openDetail(location.hash.slice(1));
    render();
  }

  // ---------- bar panel ----------
  function openBar() {
    var groups = {};
    INGREDIENTS.forEach(function (i) { (groups[i.category] = groups[i.category] || []).push(i); });
    var order = ["spirit", "vermouth", "fortified", "wine", "liqueur", "amaro", "bitters", "juice", "syrup", "other"];
    var html = '<button class="close" aria-label="Close">×</button>' +
      '<div class="eyebrow">Your bar</div><h2>What’s on the shelf</h2>' +
      '<p class="meta">Check what you own. Recipes then show what you can pour — and what’s one bottle away.</p>' +
      '<label style="display:flex;gap:8px;align-items:center;font-size:.9rem"><input type="checkbox" id="basicsChk" ' + (state.assumeBasics ? "checked" : "") + '> Assume I have common bitters, water &amp; soda</label>' +
      '<input class="bar-search" id="barSearch" placeholder="Filter ingredients…" autocomplete="off">' +
      '<div class="bar-actions"><button class="btn" id="barNone">Clear all</button>' +
        '<button class="btn" id="barSpirits">Check all spirits</button></div>' +
      '<div id="barList">';
    order.forEach(function (cat) {
      if (!groups[cat]) return;
      html += '<div class="bar-group" data-cat="' + cat + '"><h4>' + cat + '</h4>';
      groups[cat].sort(function (a, b) { return a.name.localeCompare(b.name); }).forEach(function (i) {
        html += '<label data-name="' + esc((i.name + " " + (i.aliases || []).join(" ")).toLowerCase()) + '">' +
          '<input type="checkbox" value="' + i.id + '" ' + (state.bar.has(i.id) ? "checked" : "") + '>' +
          '<span>' + esc(i.name) + (i.pantry ? ' <span style="color:var(--ink-soft);font-size:.8rem">· basic</span>' : "") + "</span></label>";
      });
      html += "</div>";
    });
    html += "</div>";
    var sheet = document.getElementById("barSheet");
    sheet.innerHTML = html;
    sheet.style.transform = ""; sheet.style.transition = "";
    var barOv = document.getElementById("barOverlay");
    var wasOpen = barOv.classList.contains("open");
    barOv.classList.add("open");
    document.body.style.overflow = "hidden";
    if (!wasOpen) history.pushState({ bar: 1 }, "");

    sheet.querySelector(".close").addEventListener("click", function () { closeBar(); });
    sheet.addEventListener("change", function (e) {
      if (e.target.id === "basicsChk") { state.assumeBasics = e.target.checked; save(LS.basics, state.assumeBasics); render(); return; }
      if (e.target.type === "checkbox") {
        if (e.target.checked) state.bar.add(e.target.value); else state.bar.delete(e.target.value);
        save(LS.bar, Array.from(state.bar));
        render();
      }
    });
    sheet.querySelector("#barSearch").addEventListener("input", function () {
      var q = this.value.toLowerCase();
      sheet.querySelectorAll("#barList label").forEach(function (l) { l.hidden = q && l.dataset.name.indexOf(q) < 0; });
      sheet.querySelectorAll(".bar-group").forEach(function (g) {
        g.hidden = ![].some.call(g.querySelectorAll("label"), function (l) { return !l.hidden; });
      });
    });
    sheet.querySelector("#barNone").addEventListener("click", function () {
      state.bar.clear(); save(LS.bar, []); sheet.querySelectorAll('input[type=checkbox]').forEach(function (c) { if (c.id !== "basicsChk") c.checked = false; }); render();
    });
    sheet.querySelector("#barSpirits").addEventListener("click", function () {
      INGREDIENTS.forEach(function (i) { if (i.category === "spirit") state.bar.add(i.id); });
      save(LS.bar, Array.from(state.bar));
      sheet.querySelectorAll('.bar-group[data-cat=spirit] input').forEach(function (c) { c.checked = true; });
      render();
    });
  }
  function closeBar(fromHistory) {
    var barOv = document.getElementById("barOverlay");
    if (!barOv.classList.contains("open")) return;
    if (!fromHistory && history.state && history.state.bar) { history.back(); return; }
    barOv.classList.remove("open");
    document.body.style.overflow = "";
    var sheet = document.getElementById("barSheet");
    sheet.style.transition = ""; sheet.style.transform = "";
  }

  // ---------- misc ----------
  function uniq(a) { return a.filter(function (v, i) { return a.indexOf(v) === i; }).sort(); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (m) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[m]; }); }

  var fadeEl = document.getElementById("scrollfade");
  function updateFade() {
    if (!fadeEl) return;
    var doc = document.documentElement;
    var longEnough = doc.scrollHeight > window.innerHeight * 1.6;
    var atBottom = window.innerHeight + window.scrollY >= doc.scrollHeight - 8;
    fadeEl.style.opacity = (longEnough && !atBottom) ? "1" : "0";
  }
  window.addEventListener("scroll", updateFade, { passive: true });
  window.addEventListener("resize", updateFade);

  // swipe a bottom-sheet down to dismiss (touch, narrow viewports only)
  var mqNarrow = window.matchMedia("(max-width: 600px)");
  function enableSwipeClose(el, onClose) {
    var startY = 0, dy = 0, dragging = false;
    el.addEventListener("touchstart", function (e) {
      if (!mqNarrow.matches || el.scrollTop > 0 || e.touches.length !== 1) { dragging = false; return; }
      startY = e.touches[0].clientY; dy = 0; dragging = true;
      el.style.transition = "";
    }, { passive: true });
    el.addEventListener("touchmove", function (e) {
      if (!dragging) return;
      dy = e.touches[0].clientY - startY;
      el.style.transform = dy > 0 ? "translateY(" + dy + "px)" : "";
    }, { passive: true });
    el.addEventListener("touchend", function () {
      if (!dragging) return;
      dragging = false;
      el.style.transition = "transform .2s ease";
      if (dy > 90) onClose();
      else el.style.transform = "";
    });
  }
  enableSwipeClose(document.getElementById("sheet"), function () { closeDetail(); });
  enableSwipeClose(document.getElementById("barSheet"), function () { closeBar(); });

  // ---------- theme ----------
  var SUN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';
  var mqDark = window.matchMedia("(prefers-color-scheme: dark)");
  function readTheme() { try { return localStorage.getItem(LS.theme); } catch (e) { return null; } }
  function applyTheme(t) {
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    var dark = t ? t === "dark" : mqDark.matches;
    var btn = document.getElementById("themeBtn");
    btn.innerHTML = dark ? SUN : MOON;
    btn.setAttribute("aria-pressed", dark ? "true" : "false");
    btn.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
    btn.title = dark ? "Light theme" : "Dark theme";
  }
  applyTheme(readTheme());
  document.getElementById("themeBtn").addEventListener("click", function () {
    var next = document.getElementById("themeBtn").getAttribute("aria-pressed") === "true" ? "light" : "dark";
    try { localStorage.setItem(LS.theme, next); } catch (e) {}
    applyTheme(next);
  });
  mqDark.addEventListener("change", function () { if (!readTheme()) applyTheme(null); });

  document.getElementById("q").addEventListener("input", function () { state.q = this.value.trim(); render(); });
  document.getElementById("u-oz").addEventListener("click", function () { setUnits("oz"); });
  document.getElementById("u-ml").addEventListener("click", function () { setUnits("ml"); });
  document.getElementById("favToggle").addEventListener("click", function () { state.favOnly = !state.favOnly; syncToggles(); render(); });
  document.getElementById("barToggle").addEventListener("click", function () {
    state.barOnly = !state.barOnly;
    if (state.barOnly && !state.bar.size) { openBar(); state.barOnly = false; }
    syncToggles(); render();
  });
  document.getElementById("openBar").addEventListener("click", openBar);
  document.getElementById("overlay").addEventListener("click", function (e) { if (e.target === this) closeDetail(); });
  document.getElementById("barOverlay").addEventListener("click", function (e) { if (e.target === this) closeBar(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeDetail(); closeBar(); }
    if (e.key === "/" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); document.getElementById("q").focus(); }
  });
  window.addEventListener("popstate", function () {
    if (document.getElementById("barOverlay").classList.contains("open")) { closeBar(true); return; }
    if (location.hash.length > 1) openDetail(decodeURIComponent(location.hash.slice(1)), true, true);
    else closeDetail(true);
  });

  // ---------- collection load / reset / drag-drop ----------
  document.getElementById("collLoad").addEventListener("click", function () {
    document.getElementById("collFile").click();
  });
  document.getElementById("collFile").addEventListener("change", function () {
    ingestFile(this.files && this.files[0]);
    this.value = "";
  });
  document.getElementById("collReset").addEventListener("click", function () {
    if (!confirm("Reset to the public collection? Your loaded recipes will be removed from this browser (favorites and bar are kept).")) return;
    loadPublic();
  });
  var dragDepth = 0;
  window.addEventListener("dragenter", function (e) {
    if (e.dataTransfer && [].indexOf.call(e.dataTransfer.types, "Files") >= 0) {
      dragDepth++; document.body.classList.add("dragging");
    }
  });
  window.addEventListener("dragover", function (e) { e.preventDefault(); });
  window.addEventListener("dragleave", function () { if (--dragDepth <= 0) document.body.classList.remove("dragging"); });
  window.addEventListener("drop", function (e) {
    e.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging");
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) ingestFile(f);
  });

  bootstrap();
})();
</script>
</body>
</html>
